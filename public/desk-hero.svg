    <path d="M210 80v148" stroke="#c5d4da" stroke-width="2"/>
    <path d="M138 118h56M138 140h52M138 162h48M138 184h54" stroke="#b7c8cf" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
    <path d="M226 118h56M226 140h52M226 162h48M226 184h54" stroke="#b7c8cf" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
    <!-- bookmark -->
    <path d="M168 80v46l12-8 12 8V80" fill="#d97745"/>
  </g>
  <!-- tea cup -->
  <g transform="translate(318 198)">
    <rect x="0" y="18" width="44" height="36" rx="8" fill="#f4ebe0" stroke="#c4a484" stroke-width="2"/>
    <path d="M44 28c10 0 14 8 14 14s-4 14-14 14" stroke="#c4a484" stroke-width="2" fill="none"/>
    <ellipse cx="22" cy="22" rx="16" ry="5" fill="#2f6f62" opacity="0.7"/>
    <path d="M12 6c2-6 8-6 10 0M22 4c2-6 8-6 10 0" stroke="#8aa8a0" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  </g>
  <!-- pen -->
  <g transform="translate(78 210) rotate(-28)">
    <rect x="0" y="0" width="78" height="8" rx="4" fill="#1f6b5c"/>
    <path d="M78 0h14l6 4-6 4H78V0Z" fill="#d97745"/>
