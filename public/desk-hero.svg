<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="desk" x1="40" y1="280" x2="380" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1f6b5c"/>
      <stop offset="1" stop-color="#2a8f7a"/>
    </linearGradient>
    <linearGradient id="page" x1="120" y1="80" x2="300" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fbf8f2"/>
      <stop offset="1" stop-color="#eef4f6"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1f6b5c" flood-opacity="0.18"/>
    </filter>
  </defs>
  <!-- desk surface -->
  <path d="M36 278c40-18 120-28 174-28s134 10 174 28v28H36v-28Z" fill="url(#desk)" opacity="0.9"/>
  <ellipse cx="210" cy="278" rx="180" ry="18" fill="#163f38" opacity="0.2"/>
